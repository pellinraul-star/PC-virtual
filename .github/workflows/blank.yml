<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC Builder Virtual - RTX 5070</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
    min-height: 100vh;
}

header {
    padding: 30px 20px;
    text-align: center;
    background: linear-gradient(135deg, #111827, #1e293b);
    border-bottom: 2px solid #334155;
}

header h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

header p {
    color: #94a3b8;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: #111827;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.card h2 {
    margin-bottom: 18px;
    color: #60a5fa;
}

.component {
    margin-bottom: 16px;
}

.component label {
    display: block;
    margin-bottom: 7px;
    color: #cbd5e1;
    font-weight: bold;
}

select {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 15px;
}

select:focus {
    outline: 2px solid #3b82f6;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button.secondary {
    background: #475569;
}

button.secondary:hover {
    background: #64748b;
}

.price {
    font-size: 36px;
    font-weight: bold;
    color: #4ade80;
    margin-bottom: 20px;
}

.specs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.spec {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 9px;
    padding: 13px;
}

.spec span {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 5px;
}

.spec strong {
    font-size: 16px;
}

.status {
    margin-top: 20px;
    padding: 16px;
    background: #0f172a;
    border-radius: 10px;
    line-height: 1.7;
}

.good {
    color: #4ade80;
}

.warning {
    color: #facc15;
}

.bad {
    color: #f87171;
}

.performance {
    margin-top: 25px;
}

.game {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}

.game-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 9px;
}

.fps {
    font-weight: bold;
    color: #4ade80;
}

.bar {
    height: 10px;
    width: 100%;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    background: #3b82f6;
    border-radius: 10px;
}

.game small {
    display: block;
    margin-top: 8px;
    color: #94a3b8;
}

.parts-list {
    margin-top: 10px;
}

.part {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 5px;
    border-bottom: 1px solid #334155;
}

.part strong {
    text-align: right;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background: #1e3a8a;
    color: #bfdbfe;
    font-size: 13px;
    margin-bottom: 15px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

@media(max-width: 850px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .specs {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

