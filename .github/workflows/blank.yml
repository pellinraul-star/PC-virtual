<!-- COMPONENTES SELECIONADOS -->
<!-- ========================= -->

<div class="card" style="margin-top:20px;">

<h2>📦 Componentes selecionados</h2>

<div class="parts-list" id="partsList"></div>

</div>

</div>


<footer>

PC Builder Virtual • Simulador educativo<br>
Preços e FPS são estimativas e podem variar conforme o hardware, configurações e jogo.

</footer>


<script>

/* =====================================
   JOGOS
===================================== */

const games = [

{
    name: "GTA V",
    base: 180
},

{
    name: "Red Dead Redemption 2",
    base: 100
},

{
    name: "Resident Evil 2 Remake",
    base: 170
},

{
    name: "Resident Evil 3 Remake",
    base: 155
},

{
    name: "Resident Evil 4 Remake",
    base: 120
},

{
    name: "Metal Gear Solid V",
    base: 180
},

{
    name: "Cyberpunk 2077",
    base: 100
},

{
    name: "Forza Horizon 5",
    base: 125
},

{
    name: "Uncharted: Legacy of Thieves",
    base: 95
},

{
    name: "Hogwarts Legacy",
    base: 90
},

{
    name: "The Last of Us Part I",
    base: 80
},

{
    name: "Alan Wake 2",
    base: 65
}

];


/* =====================================
   FORMATAR DINHEIRO
===================================== */

function money(value) {

    return value.toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


/* =====================================
   PEGAR OPTION SELECIONADA
===================================== */

function getOption(id) {

    const select =
        document.getElementById(id);

    return select.options[
        select.selectedIndex
    ];

}


/* =====================================
   MONTAR PC
===================================== */

function buildPC() {

    const cpu =
        getOption("cpu");

    const gpu =
        getOption("gpu");

    const ram =
        getOption("ram");

    const storage =
        getOption("storage");

    const psu =
        getOption("psu");

    const motherboard =
        getOption("motherboard");

    const pcCase =
        getOption("case");


    const total =

        Number(cpu.dataset.price) +

        Number(gpu.dataset.price) +

        Number(ram.dataset.price) +

        Number(storage.dataset.price) +

        Number(psu.dataset.price) +

        Number(motherboard.dataset.price) +

        Number(pcCase.dataset.price);


    document.getElementById("total")
        .textContent = money(total);


    document.getElementById("cpuResult")
        .textContent =
        cpu.textContent.split("—")[0].trim();


    document.getElementById("gpuResult")
        .textContent =
        gpu.textContent.split("—")[0].trim();


    document.getElementById("vramResult")
        .textContent =
        gpu.dataset.vram + " GB";


    document.getElementById("ramResult")
        .textContent =
        ram.dataset.capacity +
        " GB " +
        ram.dataset.type;


    document.getElementById("storageResult")
        .textContent =
        storage.textContent.split("—")[0].trim();


    document.getElementById("psuResult")
        .textContent =
        psu.value + "W";


    document.getElementById("mbResult")
        .textContent =
        motherboard.textContent.split("—")[0].trim();


    checkCompatibility(
        cpu,
        gpu,
        ram,
        psu,
        motherboard
    );


    calculateFPS(
        cpu,
        gpu,
        ram
    );


    showParts(
        cpu,
        gpu,
        ram,
        storage,
        psu,
        motherboard,
        pcCase
    );

}


/* =====================================
   COMPATIBILIDADE
===================================== */

function checkCompatibility(
    cpu,
    gpu,
    ram,
    psu,
    motherboard
) {

    const result =
        document.getElementById(
            "compatibility"
        );


    let messages = [];


    /* SOCKET */

    if (
        cpu.dataset.socket !==
        motherboard.dataset.socket
    ) {

        messages.push(
            `<div class="bad">
            ❌ CPU e placa-mãe possuem sockets diferentes.
            </div>`
        );

    } else {

        messages.push(
            `<div class="good">
            ✅ CPU e placa-mãe são compatíveis.
            </div>`
        );

    }


    /* RAM */

    if (
        ram.dataset.type !==
        motherboard.dataset.ram
    ) {

        messages.push(
            `<div class="bad">
            ❌ O tipo de RAM não corresponde à placa-mãe.
            </div>`
        );

    } else {

        messages.push(
            `<div class="good">
            ✅ RAM compatível com a placa-mãe.
            </div>`
        );

    }


    /* FONTE */

    const gpuScore =
        Number(gpu.dataset.score);


    let recommendedPower = 550;


    if (gpuScore >= 190) {

        recommendedPower = 850;

    }

    else if (gpuScore >= 160) {

        recommendedPower = 750;

    }

    else if (gpuScore >= 130) {

        recommendedPower = 650;

    }


    if (
        Number(psu.value) <
        recommendedPower
    ) {

        messages.push(
            `<div class="warning">
            ⚠️ Recomenda-se uma fonte de aproximadamente
            ${recommendedPower}W ou superior.
            </div>`
        );

    } else {

        messages.push(
            `<div class="good">
            ✅ Potência da fonte adequada.
            </div>`
        );

    }


    /* RAM */

    const ramCapacity =
        Number(ram.dataset.capacity);


    if (ramCapacity >= 32) {

        messages.push(
            `<div class="good">
            ✅ 32 GB ou mais de RAM: excelente para jogos.
            </div>`
        );

    }

    else if (ramCapacity >= 16) {

        messages.push(
            `<div class="good">
            ✅ 16 GB de RAM: adequado para muitos jogos.
            </div>`
        );

    }


    /* GPU */

    if (
        gpu.value === "rtx5070"
    ) {

        messages.push(
            `<div class="good">
            🚀 RTX 5070 12 GB selecionada.
            Configuração de alto desempenho.
            </div>`
        );

    }

    result.innerHTML =
        messages.join("");

}


/* =====================================
   FPS
===================================== */

function calculateFPS(
    cpu,
    gpu,
    ram
) {

    const container =
        document.getElementById("games");


    const cpuScore =
        Number(cpu.dataset.score);


    const gpuScore =
        Number(gpu.dataset.score);


    const ramCapacity =
        Number(ram.dataset.capacity);


    /*
       O cálculo abaixo é apenas
       uma estimativa simplificada.
    */

    let performance =

        (cpuScore * 0.35) +

        (gpuScore * 0.65);


    let ramMultiplier = 1;


    if (ramCapacity >= 64) {

        ramMultiplier = 1.08;

    }

    else if (ramCapacity >= 32) {

        ramMultiplier = 1.04;

    }

    else if (ramCapacity < 16) {

        ramMultiplier = 0.75;

    }


    performance *=
        ramMultiplier;


    container.innerHTML = "";


    games.forEach(game => {

        let fps =

            game.base *
            (performance / 100);


        fps = Math.round(fps);


        fps = Math.max(
            5,
            Math.min(240, fps)
        );


        const percentage =

            Math.min(
                100,
                (fps / 240) * 100
            );


        let quality;


        if (fps >= 144) {

            quality = "🔥 Excelente";

        }

        else if (fps >= 100) {

            quality = "🟢 Muito bom";

        }

        else if (fps >= 60) {

            quality = "🟢 Bom";

        }

        else if (fps >= 30) {

            quality = "🟡 Jogável";

        }

        else {

            quality = "🔴 Baixo";

        }


        container.innerHTML += `

        <div class="game">

            <div class="game-header">

                <strong>
                    ${game.name}
                </strong>

                <span class="fps">
                    ${fps} FPS
                </span>

            </div>

            <div class="bar">

                <div
                    class="bar-fill"
                    style="width:${percentage}%">
                </div>

            </div>

            <small>
                ${quality} • Estimativa em 1080p
            </small>

        </div>

        `;

    });

}


/* =====================================
   LISTA DE PEÇAS
===================================== */

function showParts(
    cpu,
    gpu,
    ram,
    storage,
    psu,
    motherboard,
    pcCase
) {

    const list =
        document.getElementById(
            "partsList"
        );


    const parts = [

        ["🧠 CPU", cpu],

        ["🎮 GPU", gpu],

        ["🧠 RAM", ram],

        ["💾 SSD", storage],

        ["🔌 Fonte", psu],

        ["🧩 Placa-mãe", motherboard],

        ["🖥️ Gabinete", pcCase]

    ];


    list.innerHTML = "";


    parts.forEach(part => {

        list.innerHTML += `

        <div class="part">

            <span>
                ${part[0]}
            </span>

            <strong>
                ${part[1].textContent.trim()}
            </strong>

        </div>

        `;

    });

}


/* =====================================
   RESTAURAR
===================================== */

function resetPC() {

    document.getElementById("cpu")
        .selectedIndex = 0;


    document.getElementById("gpu")
        .selectedIndex = 0;


    document.getElementById("ram")
        .selectedIndex = 0;


    document.getElementById("storage")
        .selectedIndex = 0;


    document.getElementById("psu")
        .selectedIndex = 0;


    document.getElementById("motherboard")
        .selectedIndex = 0;


    document.getElementById("case")
        .selectedIndex = 0;


    document.getElementById("total")
        .textContent = "R$ 0";


    document.getElementById("cpuResult")
        .textContent = "-";


    document.getElementById("gpuResult")
        .textContent = "-";


    document.getElementById("vramResult")
        .textContent = "-";


    document.getElementById("ramResult")
        .textContent = "-";


    document.getElementById("storageResult")
        .textContent = "-";


    document.getElementById("psuResult")
        .textContent = "-";


    document.getElementById("mbResult")
        .textContent = "-";


    document.getElementById("compatibility")
        .innerHTML =
        "Monte o PC para verificar.";


    document.getElementById("games")
        .innerHTML = "";


    document.getElementById("partsList")
        .innerHTML = "";

}

</script>

</body>
</html>
